apiVersion: apps/v1
kind: Deployment
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: init-config
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          command: ['sh', '-c', 'cp /tmp/initial-config/configuration.yaml /config/configuration.yaml && mkdir -p /config/.storage && cp /tmp/http-storage/http /config/.storage/http && cp /tmp/onboarding-storage/onboarding /config/.storage/onboarding']
          volumeMounts:
            - name: config
              mountPath: /config
            - name: initial-config
              mountPath: /tmp/initial-config
            - name: http-storage
              mountPath: /tmp/http-storage
            - name: onboarding-storage
              mountPath: /tmp/onboarding-storage
      containers:
        - name: home-assistant
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8123
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-config
        - name: initial-config
          configMap:
            name: home-assistant-initial-config
        - name: http-storage
          configMap:
            name: home-assistant-http-storage
        - name: onboarding-storage
          configMap:
            name: home-assistant-onboarding-storage
